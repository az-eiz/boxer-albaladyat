<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة تحكم Boxer Albaladyat</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <main class="admin-panel">
        <h1>لوحة تحكم Boxer Albaladyat</h1>

        <section id="loginBox">
            <input id="email" type="email" placeholder="البريد الإلكتروني">
            <input id="password" type="password" placeholder="كلمة المرور">
            <button id="loginButton" class="admin-btn primary">تسجيل الدخول</button>
            <p id="loginMessage"></p>
        </section>

        <section id="dashboard" hidden>
            <button id="logoutButton" class="admin-btn danger">تسجيل الخروج</button>

            <h2>إعدادات الموقع</h2>
            <input id="siteTitle" placeholder="اسم الموقع">
            <input id="phone" placeholder="رقم الهاتف">
            <input id="locationName" placeholder="اسم الموقع">
            <input id="mapUrl" value="https://maps.app.goo.gl/Dqd6VUGC9ceePGnq6">
            <input id="hours" placeholder="أوقات العمل">
            <textarea id="heroText" placeholder="وصف الموقع"></textarea>
            <button id="saveButton" class="admin-btn primary">حفظ الإعدادات</button>
            <p id="saveMessage"></p>

            <h2>المنتجات</h2>
            <div id="productsAdmin"></div>
            <button id="addProductButton" class="admin-btn primary">إضافة منتج</button>
            <p id="productsMessage"></p>

            <h2>الخدمات</h2>
            <div id="servicesAdmin"></div>
            <button id="addServiceButton" class="admin-btn primary">إضافة خدمة</button>
            <p id="servicesMessage"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/admin/utils.js"></script>
    <script src="assets/js/admin/auth.js"></script>
    <script src="assets/js/admin/settings.js"></script>
    <script src="assets/js/admin/products.js"></script>
    <script src="assets/js/admin/services.js"></script>
    <script src="assets/js/admin/main.js"></script>
</body>

</html>
